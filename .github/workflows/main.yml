name: KHT Fashion House Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Check bot imports
        run: |
          python -c "import telegram; print('Telegram library installed successfully')"

      - name: Verify bot structure
        run: |
          python - <<'PY'
          import ast

          with open("main.py", encoding="utf-8") as f:
              tree = ast.parse(f.read())

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          required = {
              "main",
              "start",
              "show_products",
              "order_start",
              "business_summary",
          }

          missing = required - functions
          if missing:
              raise SystemExit(f"Missing functions: {sorted(missing)}")

          print("KHT Bot structure verified!")
          PY
